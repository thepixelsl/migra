name: Build Bunny image

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: development
        type: choice
        options:
          - development
          - production
      deploy:
        description: Publish a reviewed Hub release to the existing Bunny app
        required: false
        default: false
        type: boolean
      hub_release:
        description: Reviewed Hub release ID
        required: false
        default: ""
        type: string

concurrency:
  group: bunny-image-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-bunny-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Bunny runtime
        run: npm run test:bunny && node --test tests/hub-bunny-state.test.mjs

      - name: Test migrated HTML sanitizer
        run: npm run test:migration-sanitizer

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ inputs.target == 'development' }}
            type=sha,prefix=sha-,enable=${{ inputs.target == 'development' }}
            type=raw,value=production,enable=${{ inputs.target == 'production' }}
            type=sha,format=long,prefix=prod-sha-,enable=${{ inputs.target == 'production' }}

      - name: Build and push linux/amd64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            HUB_RELEASE_ID=${{ inputs.deploy && inputs.hub_release || '' }}
            PUBLIC_SITE_URL=${{ inputs.target == 'production' && 'https://artbild-fotografie.de' || 'https://mc-k5f22r07h0.bunny.run' }}
            PUBLIC_TRACKING_ENV=${{ vars.PUBLIC_TRACKING_ENV || 'production' }}
            PUBLIC_TRACKING_ALLOWED_HOSTS=${{ vars.PUBLIC_TRACKING_ALLOWED_HOSTS || 'artbild-fotografie.de,www.artbild-fotografie.de' }}
            PUBLIC_GTM_CONTAINER_ID=${{ vars.PUBLIC_GTM_CONTAINER_ID || 'GTM-5TM37JC' }}
            PUBLIC_GA4_MEASUREMENT_ID=${{ vars.PUBLIC_GA4_MEASUREMENT_ID || 'G-TSWGFD1YKF' }}
            PUBLIC_GA4_DATA_RETENTION_MONTHS=${{ vars.PUBLIC_GA4_DATA_RETENTION_MONTHS || '14' }}
            PUBLIC_GOOGLE_ADS_ID=${{ vars.PUBLIC_GOOGLE_ADS_ID || 'AW-874983678' }}
            PUBLIC_GOOGLE_ADS_CONVERSION_LABEL=${{ vars.PUBLIC_GOOGLE_ADS_CONVERSION_LABEL || 'J-MWCM7x9IsdEP7hnKED' }}
            PUBLIC_OPENAI_ADS_PIXEL_ID=${{ vars.PUBLIC_OPENAI_ADS_PIXEL_ID || '' }}
            PUBLIC_CONSENT_VERSION=${{ '2026-10-01.3' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish reviewed Hub release to Bunny
        if: inputs.deploy && inputs.target == 'production' && startsWith(github.ref_name, 'hub-release/')
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
          HUB_RELEASE_ID: ${{ inputs.hub_release }}
          HUB_IMAGE_TAG: prod-sha-${{ github.sha }}
          HUB_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/deploy-hub-bunny.mjs
