name = "migra"
main = "src/worker.js"
compatibility_date = "2026-07-03"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

assets = { directory = "./dist", binding = "ASSETS", run_worker_first = true }

[[kv_namespaces]]
binding = "AVAILABILITY_KV"
id = "a0de8186c952464a9bfae2e6283b15dc"

[[durable_objects.bindings]]
name = "AGENT_RATE_LIMITER"
class_name = "AgentRateLimiter"

[exports.AgentRateLimiter]
type = "durable-object"
storage = "sqlite"
